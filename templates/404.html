{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block auth_content %}
<div style="min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px; background: var(--cream);">
  <i class="bi bi-emoji-frown" style="font-size:3rem; color: var(--green-600);"></i>
  <h2>404 - Page Not Found</h2>
  <p style="color: var(--ink-600);">The page you're looking for doesn't exist.</p>
  <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-brand">Go Home</a>
</div>
{% endblock %}
